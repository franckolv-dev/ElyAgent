services:

  # ── AI Agent Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberentity-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/db:/app/data
      - ./config:/config:ro
      - ${SSH_KEYS_PATH:-~/.ssh}:/root/.ssh:ro
    env_file:
      - .env
    environment:
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=sqlite+aiosqlite:////app/data/cyberentity.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - RATE_LIMIT=60/minute
      - QDRANT_URL=http://qdrant:6333
      - NTFY_URL=${NTFY_URL:-http://ntfy:80}
      - NTFY_TOPIC=${NTFY_TOPIC:-cyberentity}
      - TTS_VOICE=${TTS_VOICE:-fr-FR-DeniseNeural}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cyberentity-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Next.js Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: cyberentity-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cyberentity-net

  # ── Qdrant vector database (local memory + security rules) ────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cyberentity-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cyberentity-net

  # ── ntfy push notification server (Android HITL) ─────────────────────
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: cyberentity-ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "7070:80"
    volumes:
      - ntfy-data:/var/lib/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:7070}
      - NTFY_BEHIND_PROXY=false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/v1/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cyberentity-net

networks:
  cyberentity-net:
    driver: bridge

volumes:
  qdrant-data:
  ntfy-data:
