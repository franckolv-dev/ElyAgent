services:

  # ── AI Agent Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Couche 2 PII NER : embarque gliner+torch dans l'image (opt-in,
        # ~800 Mo installés). Requis seulement si PII_NER_ENABLED=true.
        - PII_NER_INSTALL=${PII_NER_INSTALL:-0}
    restart: unless-stopped
    # B-16 (revue 2026-06-10) — le backend est LE service dont la RAM croît
    # avec le nombre d'utilisateurs (faster-whisper, fastembed, Chromium
    # Playwright, caches). Sans cap, il peut
    # pousser le Mac hôte en swap et dégrader LM Studio — exactement le
    # scénario que le mem_limit du frontend visait déjà. À recalibrer si
    # OOM-kill constaté (docker inspect → OOMKilled: true).
    # 4g → 5g le 2026-06-11 : la couche 2 PII charge le GLiNER ONNX fp32
    # (~1,2 Go) — les quantizations int8/fp16 dégradaient trop le rappel
    # (validation de l'export rejetée). À redescendre si un int8 propre
    # est trouvé un jour.
    mem_limit: 5g
    ports:
      - "${ELY_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data/db:/app/data
      # B-9 (revue 2026-06-10) — /app/uploads n'était PAS persisté : chaque
      # rebuild perdait les fichiers uploadés et les captures d'écran dont
      # les chemins restent référencés dans l'historique des conversations.
      - ./data/uploads:/app/uploads
      - ./config:/config:ro
      # SSH keys mount for ssh_* tools. DEFAULT is ./data/ssh (a local empty
      # directory) — NOT your personal ~/.ssh — so a fresh `make up` doesn't
      # leak your private SSH identities into the container.
      # To enable SSH actions: copy the keys you want exposed into ./data/ssh/
      # OR override SSH_KEYS_PATH in .env (e.g. SSH_KEYS_PATH=~/.ssh).
      - ${SSH_KEYS_PATH:-./data/ssh}:/root/.ssh:ro
      - ./desktop/dist:/app/static/desktop:ro
      - ./data/backups/qdrant:/backups/qdrant
      - ./data/playwright:/app/.cache/playwright
      - fastembed-cache:/app/.cache/fastembed
      # Couche 2 PII NER — modèle GLiNER ONNX int8 exporté sur l'HÔTE par
      # backend/scripts/export_gliner_onnx.py (jamais dans le conteneur :
      # l'export PyTorch fp32 pèse 2.5 Go de RSS, le cap est à 4g). Bind
      # mount host pour que l'export y écrive directement.
      - ./data/pii_ner:/app/.cache/pii_ner
      # Dossier à indexer automatiquement, en LECTURE SEULE (21/08).
      #
      # Monté au MÊME chemin absolu des deux côtés — c'est le détail qui
      # compte : `/Users/toi/Documents` existe alors tel quel dans le
      # conteneur, aucune traduction de chemin n'est nécessaire, et les
      # citations RAG restent vraies (« trouvé dans /Users/toi/Documents/x.pdf »
      # désigne bien un fichier de TA machine).
      #
      # Sans ce montage, l'indexation passe par le démon ELY Desktop, qui doit
      # tourner. Avec, elle n'a besoin de rien — voir `auto_indexer._mode_de_lecture`.
      #
      # ⚠️ Le défaut a l'air bizarre, et c'est délibéré. Quand `ELY_INDEX_PATH`
      # est vide, on monte un dossier du dépôt (qui existe forcément) sur une
      # cible que personne n'utilise : un no-op dont on est SÛR. Le montage de
      # `/dev/null` sur lui-même serait plus élégant, mais je n'ai pas pu le
      # vérifier à l'exécution — et un défaut non vérifié qui casse `make up`
      # coûte plus cher qu'une ligne inélégante.
      - ${ELY_INDEX_PATH:-./data/db}:${ELY_INDEX_PATH:-/app/.index-non-configure}:ro
    env_file:
      - .env
    environment:
      - JWT_ALGORITHM=HS256
      - PLAYWRIGHT_BROWSERS_PATH=/app/.cache/playwright
      - FASTEMBED_CACHE_DIR=/app/.cache/fastembed
      # uv (Astral) workdirs — required so `uv tool run mcp-server-*`
      # (Sprint 4a MCP client) doesn't fall back to /root/.local which
      # is writable but not persisted across container rebuilds. Both
      # under /tmp because the MCP servers are ephemeral by design.
      - UV_TOOL_DIR=/tmp/uv-tools
      - UV_CACHE_DIR=/tmp/uv-cache
      # ACCESS_TOKEN_EXPIRE_MINUTES + REFRESH_TOKEN_EXPIRE_DAYS purposely
      # NOT set here — let .env values win. Default is 15 min / 7 days
      # (15 min depuis v1.14.2, B-18/D2), see app/config.py. Setting them
      # here would override .env silently.
      - DATABASE_URL=sqlite+aiosqlite:////app/data/cyberentity.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - RATE_LIMIT=60/minute
      - QDRANT_URL=http://qdrant:6333
      # Aligné sur le défaut applicatif (v1.14.2) — l'ancien défaut compose
      # DeniseNeural écrasait silencieusement le nouveau défaut du code.
      - TTS_VOICE=${TTS_VOICE:-fr-FR-VivienneMultilingualNeural}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SLM_ENABLED=${SLM_ENABLED:-false}
      # ⚠️ PLUS DE DÉFAUT ICI (22/08). Cette ligne posait
      # « qwen2.5:3b-instruct », donc `settings.slm_model` n'était jamais vide
      # et ce modèle était réclamé aux serveurs locaux quel que soit ce que
      # l'utilisateur avait installé — un 404 au moment de répondre, pas au
      # moment de configurer. Vide = « non déclaré », et le code demande alors
      # au serveur ce qu'il sert réellement (`resolve_local_model`).
      - SLM_MODEL=${SLM_MODEL:-}
      - SLM_COMPLEXITY_THRESHOLD=${SLM_COMPLEXITY_THRESHOLD:-40}
      - SLM_TIMEOUT=${SLM_TIMEOUT:-25.0}
      # Couche 2 PII NER (GLiNER ONNX int8) — défaut OFF. Pré-requis si on
      # l'active : (1) image buildée avec PII_NER_INSTALL=1, (2) modèle
      # exporté dans ./data/pii_ner (scripts/export_gliner_onnx.py).
      - PII_NER_ENABLED=${PII_NER_ENABLED:-false}
      - PII_NER_MODEL_DIR=/app/.cache/pii_ner/gliner_multi_pii-v1-onnx
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cyberentity-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Next.js Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    restart: unless-stopped
    ports:
      - "${ELY_FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cyberentity-net
    # FIX 2026-05-06: limite mémoire 1.5 GB. Sans cap, Next.js standalone
    # accumule de la RAM (memory leak connu sur de longues sessions),
    # peut atteindre 10+ GB sur des Mac Studio modestes (32 GB) et
    # provoquer du swap qui ralentit drastiquement LM Studio.
    # Avec la limite, Node force un GC agressif quand il s'approche
    # du seuil. 1.5 GB est confortable pour une instance Next.js prod.
    mem_limit: 1.5g
    mem_reservation: 512m

  # ── nginx reverse proxy — single entry point on port 80 ──────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${ELY_HTTP_PORT:-80}:80"
    volumes:
      # On monte le DOSSIER config/nginx/ (pas le fichier seul). Un bind-mount
      # de fichier unique épingle l'INODE du fichier au démarrage du conteneur :
      # quand `git pull` (ou un éditeur) remplace le fichier par write-temp +
      # rename atomique, le nouvel inode n'est PAS vu par le conteneur, qui
      # continue à servir l'ANCIENNE config (502 / `nginx -s reload` lisait une
      # version périmée, parfois tronquée : « unexpected end of file …:84 »).
      # Monter le dossier fait résoudre le fichier par CHEMIN à chaque accès →
      # un `nginx -s reload` (ou recreate) voit toujours la version courante.
      # Le dossier ne contient QUE des *.conf (chargés par include conf.d/*.conf) ;
      # hosts.yaml / providers.yaml restent dans config/ et ne sont pas exposés.
      - ./config/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cyberentity-net

  # ── Qdrant vector database (local memory + security rules) ────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${ELY_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cyberentity-net

  # ── Ollama removed — ELY uses the host's native Ollama via
  # host.docker.internal:11434 to get GPU Metal acceleration on Mac.
  # Running Ollama inside a container would lose GPU access and just
  # duplicate models in RAM/disk.

  # ─────────────────────────────────────────────────────────────────────────
  # Sprint 4b V3 J2.b — Egress proxy for the python_tool sandbox.
  #
  # Squid forward proxy. The future `sandbox` service (J2.c) will live on
  # `sandbox-net` (internal: true → no native route to the Internet, no
  # native route to the other services), with this proxy as its ONLY way
  # out. The proxy is dual-homed: on `sandbox-net` to receive sandbox
  # traffic, on `cyberentity-net` to forward to the upstream Internet.
  # Allow-list is per-domain via `dstdomain` ACLs in sandbox/squid/squid.conf.
  # ─────────────────────────────────────────────────────────────────────────
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_beta
    restart: unless-stopped
    container_name: ely-egress-proxy
    # On monte le DOSSIER sandbox/squid/ (pas le fichier seul) et on pointe
    # Squid dessus via `-f`. Un bind-mount de fichier unique épingle l'INODE
    # du fichier au démarrage du conteneur : quand `git pull` (ou un éditeur)
    # remplace squid.conf par write-temp + rename atomique, le nouvel inode
    # n'est PAS vu par le conteneur, qui reste collé à l'ANCIENNE conf — un
    # `squid -k reconfigure` relirait alors une version périmée (même piège
    # que nginx, cf. le mount config/nginx/ plus haut). Monter le dossier fait
    # résoudre le fichier par CHEMIN à chaque lecture → un recreate (ou un
    # reconfigure) voit toujours la version courante.
    #   • Sous-dossier DÉDIÉ : sandbox/ contient aussi Dockerfile, runner/,
    #     tests… — on ne monte donc PAS tout sandbox/. Le dossier squid/ ne
    #     contient QUE squid.conf, rien d'autre n'entre dans le conteneur.
    #   • On NE monte PAS sur /etc/squid (qui garde conf.d/ + errorpage.css de
    #     l'image) : on l'expose sous /etc/squid/ely/ et on dit à Squid de
    #     lire là via `command` (l'image fait `squid "$@"`, cf. son
    #     entrypoint.sh — fournir les args via command est l'usage prévu).
    #     `-NYC` = le comportement par défaut de l'image (foreground), conservé.
    # Pour APPLIQUER un changement de squid.conf : `make egress-reload`
    # (= recreate). NE PAS compter sur un `squid -k reconfigure` seul.
    command: ["-f", "/etc/squid/ely/squid.conf", "-NYC"]
    volumes:
      - ./sandbox/squid:/etc/squid/ely:ro
    networks:
      # The sandbox lives here. `internal: true` (see below) means the
      # ONLY way out for anything on this network is through this proxy.
      - sandbox-net
      # Used to actually forward the allowed traffic upstream. Squid only
      # accepts on the sandbox-net side (ACLs in squid.conf) — being on
      # cyberentity-net does NOT mean the sandbox can talk to backend, it
      # just means the proxy itself has Internet to forward to.
      - cyberentity-net

  # ─────────────────────────────────────────────────────────────────────────
  # Sprint 4b V3 J2.c — the sandbox runner itself.
  #
  # Exposes POST /run on port 8080 (sandbox-net only). Receives a job spec
  # from the backend, spawns a fresh `python -S wrapper.py` subprocess in
  # the user-Python (the one with the curated httpx/bs4/lxml allow-list),
  # captures the single-line JSON outcome, returns it.
  #
  # Runtime hardening enforced HERE — the J2.a image already drops to uid
  # 1000 and removes pip; this section locks the rest:
  #   - read-only rootfs; only /tmp is writable (tmpfs)
  #   - all Linux caps dropped, no-new-privileges
  #   - pids/cpus/mem caps prevent fork bombs + runaway allocs
  #   - connected ONLY to sandbox-net → outbound Internet ONLY via the
  #     egress-proxy (HTTP(S)_PROXY env). Backend / qdrant / nginx are NOT
  #     reachable (different network).
  # ─────────────────────────────────────────────────────────────────────────
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: ely-sandbox:latest
    container_name: ely-sandbox
    restart: unless-stopped
    networks:
      # The runner's HTTP surface (POST /run) needs to be reachable by the
      # backend, which lives on cyberentity-net. The sandbox itself only
      # SERVES on this network — it never INITIATES traffic on it (its
      # outbound calls go via egress-proxy on sandbox-net, controlled by
      # HTTP(S)_PROXY env). So dual-homing is asymmetric in practice:
      # cyberentity-net = inbound /run from the backend; sandbox-net =
      # outbound generated-tool traffic through the proxy.
      - sandbox-net
      - cyberentity-net
    environment:
      # Force every outbound HTTP/HTTPS through the egress-proxy. httpx /
      # urllib / requests all honour these automatically.
      HTTP_PROXY: "http://egress-proxy:3128"
      HTTPS_PROXY: "http://egress-proxy:3128"
      # Sans ça, le HEALTHCHECK (urllib → localhost:8080) passe LUI AUSSI
      # par Squid qui refuse localhost → 403 → conteneur « unhealthy » en
      # permanence alors que le runner est sain (constaté 2 jours durant).
      NO_PROXY: "localhost,127.0.0.1"
      no_proxy: "localhost,127.0.0.1"
      # Tuneable resource limits applied via setrlimit inside the wrapper
      # (CPU in seconds, memory in bytes). The docker-level mem_limit /
      # pids_limit / cpus below are the harder outer wall.
      ELY_SANDBOX_CPU_SECONDS: "10"
      ELY_SANDBOX_MEM_BYTES: "268435456"   # 256 MiB
    # Filesystem hardening — rootfs is fully read-only; only /tmp is a
    # small tmpfs the wrapper can write to (job spec stays in stdin, so
    # the tmpfs is mostly a safety net).
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Capability hardening — drop everything Linux gives by default.
    # Squid in egress-proxy needs NET_BIND_SERVICE etc., but this service
    # only listens on a high port (8080) and never touches privileged ops.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource hardening — even a runaway tool can't starve the host.
    # pids_limit blocks fork bombs; mem_limit triggers OOM-kill before the
    # host sweats; cpus caps the share so one bad tool can't peg a core.
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.5
    # Healthcheck — the runner's /healthz just checks the wrapper script
    # exists. Used by docker compose `--wait` and by orchestration.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      egress-proxy:
        condition: service_started

  # ─────────────────────────────────────────────────────────────────────────
  # SearXNG — méta-moteur AUTO-HÉBERGÉ, tête de la chaîne de recherche.
  #
  # Pourquoi il est là : le 31/07/2026, deux fournisseurs de recherche sur
  # trois étaient à court de crédits gratuits et la chaîne était muette.
  # SearXNG n'a ni clé, ni compte, ni quota — il met fin à cette dépendance.
  #
  # ⚠️ Il n'a pas d'index propre : il interroge les moteurs amont depuis l'IP
  # de cette machine. On ne supprime pas la dépendance à Google ou Bing, on
  # supprime l'intermédiaire payant — et on récupère le risque de blocage.
  # C'est pourquoi Serper / SearchCans / Tavily restent EN REPLI.
  #
  # ⚠️ L'API JSON n'est PAS active par défaut : `formats` doit inclure `json`
  # dans config/searxng/settings.yml. Sans ça, le conteneur est vert, il
  # répond, et il ne rend rien d'exploitable. La sonde de démarrage attrape
  # ce cas (`search_mute`).
  #
  # Pas de port publié : seul le backend lui parle, par le réseau interne.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # Sans secret, SearXNG refuse de démarrer en mode non-debug.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-with-openssl-rand-hex-32}
    volumes:
      - ./config/searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cyberentity-net

networks:
  cyberentity-net:
    driver: bridge
  # Isolated network for the python_tool sandbox + its egress proxy.
  # `internal: true` means: no implicit route to the Internet, no NAT to the
  # host. A container on this network can only talk to other containers also
  # on this network — i.e. the egress proxy (and, later, the sandbox itself).
  sandbox-net:
    driver: bridge
    internal: true

volumes:
  qdrant-data:
  fastembed-cache:
