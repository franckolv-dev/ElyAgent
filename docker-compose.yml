services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberentity-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent database
      - ./data/db:/app/data
      # SSH config and hosts (editable without rebuild)
      - ./config:/config:ro
      # SSH keys (read-only)
      - ${SSH_KEYS_PATH:-~/.ssh}:/root/.ssh:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - ACTIVE_LLM_PROVIDER=${ACTIVE_LLM_PROVIDER:-anthropic}
      - ACTIVE_LLM_MODEL=${ACTIVE_LLM_MODEL:-claude-haiku-4-5-20251001}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=sqlite+aiosqlite:////app/data/cyberentity.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - RATE_LIMIT=60/minute
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cyberentity-net
    extra_hosts:
      # Allow backend to reach host machine (for Ollama or local services)
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberentity-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cyberentity-net

networks:
  cyberentity-net:
    driver: bridge

volumes:
  db-data:
