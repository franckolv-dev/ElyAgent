services:

  # ── AI Agent Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberentity-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/db:/app/data
      - ./config:/config:ro
      - ${SSH_KEYS_PATH:-~/.ssh}:/root/.ssh:ro
      - ./desktop/dist:/app/static/desktop:ro
      - ./data/backups/qdrant:/backups/qdrant
      - ./data/playwright:/app/.cache/playwright
      - fastembed-cache:/app/.cache/fastembed
    env_file:
      - .env
    environment:
      - JWT_ALGORITHM=HS256
      - PLAYWRIGHT_BROWSERS_PATH=/app/.cache/playwright
      - FASTEMBED_CACHE_DIR=/app/.cache/fastembed
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=sqlite+aiosqlite:////app/data/cyberentity.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - RATE_LIMIT=60/minute
      - QDRANT_URL=http://qdrant:6333
      - NTFY_URL=${NTFY_URL:-http://ntfy:80}
      - NTFY_TOPIC=${NTFY_TOPIC:-cyberentity}
      - TTS_VOICE=${TTS_VOICE:-fr-FR-DeniseNeural}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SLM_ENABLED=${SLM_ENABLED:-false}
      - SLM_MODEL=${SLM_MODEL:-qwen2.5:3b-instruct}
      - SLM_COMPLEXITY_THRESHOLD=${SLM_COMPLEXITY_THRESHOLD:-40}
      - SLM_TIMEOUT=${SLM_TIMEOUT:-25.0}
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false   # SLM optional — backend starts even if Ollama is absent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cyberentity-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Next.js Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    container_name: cyberentity-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cyberentity-net

  # ── nginx reverse proxy — single entry point on port 80 ──────────────
  nginx:
    image: nginx:alpine
    container_name: cyberentity-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cyberentity-net

  # ── Qdrant vector database (local memory + security rules) ────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cyberentity-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cyberentity-net

  # ── Ollama — local SLM inference (Phase 1) ───────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: cyberentity-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # Keep model loaded forever — eliminates 3-5s cold-start on each request
      - OLLAMA_KEEP_ALIVE=-1
      # Use all available cores for inference
      - OLLAMA_NUM_PARALLEL=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cyberentity-net

  # ── Ollama model init — pulls model once on first start ───────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: cyberentity-ollama-init
    restart: "no"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 10 && ollama pull ${SLM_MODEL:-qwen2.5:3b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - cyberentity-net

  # ── ntfy push notification server (Android HITL) ─────────────────────
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: cyberentity-ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "7070:80"
    volumes:
      - ntfy-data:/var/lib/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:7070}
      - NTFY_BEHIND_PROXY=false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/v1/health | grep -q healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cyberentity-net

networks:
  cyberentity-net:
    driver: bridge

volumes:
  qdrant-data:
  ntfy-data:
  ollama-data:
  fastembed-cache:
