name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        # Pinné sur la version du lock (pyproject `ruff>=0.6.0` + uv.lock) :
        # `uvx ruff` nu prend la DERNIÈRE release — la sortie de ruff 0.16.0
        # (23/07/2026, nouvelles règles par défaut) a cassé le check requis
        # de TOUTES les PRs d'un coup (2027 erreurs, aucune liée aux diffs).
        # Monter de version = geste volontaire : bump ce pin + corriger.
        # Depuis que backend/pyproject.toml déclare un `select` explicite, un
        # bump ne peut plus faire apparaître de règles non demandées : seul le
        # comportement des règles choisies peut bouger.
        run: uvx ruff@0.15.15 check backend/
        working-directory: .

      - name: Run tests
        env:
          # Ephemeral test-only secrets — never reused in any real environment.
          # The Settings validator refuses to boot with the default JWT key
          # (deliberate hardening), so we inject a random one per CI run.
          JWT_SECRET_KEY: ci-runner-ephemeral-jwt-secret-not-for-production-use-only
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          QDRANT_URL: "http://localhost:6333"
          ENVIRONMENT: test
        # `--cov` sans plancher (audit CI 02/09/2026) : la couverture n'etait
        # mesuree NULLE PART, donc personne ne savait quels modules la suite ne
        # touche jamais. On l'affiche d'abord ; on fixera un seuil quand on
        # connaitra le chiffre reel. Ajouter `--cov-fail-under=N` ici le jour ou
        # ce sera decide — pas avant, un seuil pose au juge casse la CI.
        run: uv run python -m pytest tests/ -v --cov=app --cov-report=term

      # Le banc canonique ne tournait que la NUIT (bench-nightly.yml) : une
      # regression de la chaine mission etait vue jusqu'a 24 h trop tard.
      # Les tags shallow+medium sont HERMETIQUES (LLM et outils simules) et
      # prennent ~1 min — ils ont leur place sur chaque PR. Le tag `deep`
      # (vrais appels LLM, ca coute) reste exclu, il est lance a la main.
      #
      # Lance depuis la RACINE du depot (le paquet `bench` vit la ; le runner
      # ajoute `backend/` a sys.path lui-meme). DB SQLite sur FICHIER
      # obligatoire : `:memory:` est par connexion, un scenario qui ecrit dans
      # une session et relit dans une autre verrait une base vide.
      - name: Canonical bench (shallow,medium)
        working-directory: .
        env:
          JWT_SECRET_KEY: ci-runner-ephemeral-jwt-secret-not-for-production-use-only
          DATABASE_URL: "sqlite+aiosqlite:///./bench_ci.db"
          QDRANT_URL: "http://localhost:6333"
          ENVIRONMENT: test
        run: PYTHONPATH=. backend/.venv/bin/python -m bench.run_canonical --tag shallow,medium

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run lint` etait MORT (audit 02/09/2026) : le script appelait
      # `next lint`, retire de Next 16, sans aucun fichier de config ESLint et
      # sans eslint installe. Le job ne faisait donc que `tsc --noEmit`. Voir
      # frontend/eslint.config.mjs pour les regles laissees en avertissement
      # sur la dette existante — tout le reste est bloquant.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Les tests des scripts de build ne passent PAS par vitest : son `include`
      # ne ramasse que `src/**/*.test.ts(x)`, et `scripts/stamp-sw-version.mjs`
      # vit hors de `src/`. Sans cette etape, les 9 tests de l'estampilleur du
      # service worker n'auraient jamais tourne ailleurs que sur le poste de
      # celui qui les a ecrits — or ce script est un maillon du build de l'image
      # (frontend/Dockerfile), et il echoue exprès quand il ne trouve plus sa
      # cible : le casser casse le deploiement.
      - name: Test build scripts
        run: node --test scripts/*.test.mjs

      # `tsc` ne voit pas ce que le compilateur Next refuse : frontiere
      # serveur/client violee, import dynamique casse, page qui n'exporte pas
      # ce qu'il faut. Sans cette etape, une PR qui casse le build passait
      # verte et ne cassait qu'au deploiement.
      - name: Build
        run: npm run build

  desktop:
    # Les 21 tests Go du daemon (dont chaque invariant anti-traversee de chemin
    # de desktop/filesystem.go) ne tournaient JAMAIS en CI : le fichier avait
    # cinq jobs et aucun n'etait Go (audit 02/09/2026). Un garde-fou de
    # securite qu'aucune CI n'exerce est un garde-fou qu'on croit avoir.
    name: Desktop daemon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # La version fait foi dans desktop/go.mod — pas de second endroit
          # a tenir a jour.
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Run tests
        run: go test ./...

  sandbox-image:
    # Sprint 4b V3 J2.a — validate that the sandbox base image still builds.
    # Doesn't push anywhere; the docker-compose `sandbox` service (J2.c) will
    # build it locally on `docker compose up --build`. Catches a broken
    # Dockerfile / dep pin bump at PR time instead of in prod.
    name: Sandbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sandbox image
        run: docker build -t ely-sandbox:ci -f sandbox/Dockerfile .

      - name: Confirm runner module imports
        # The Dockerfile's default CMD is uvicorn; for the smoke we override
        # to a one-shot import-test. A broken runner (missing dep, wrong
        # WORKDIR, busted FastAPI install) fails here.
        run: docker run --rm ely-sandbox:ci python -c "import server; print('runner OK')"

      - name: Confirm user-Python has the curated libs
        # The libs the GENERATED tool will see at runtime. Regression here
        # means the system pip install layer is broken.
        run: |
          docker run --rm ely-sandbox:ci /usr/local/bin/python -c "import httpx, bs4, lxml; print('libs OK')"

      - name: Confirm user-Python has NO pip (no runtime installs possible)
        # Defence in depth: a generated tool must NEVER be able to install
        # new packages. The Dockerfile uninstalls pip from the system Python
        # (the runner venv keeps its own pip — irrelevant, the runner exposes
        # no path to invoke it). Pin the SYSTEM-pip absence here.
        run: |
          ! docker run --rm ely-sandbox:ci /usr/local/bin/python -m pip --version 2>/dev/null

      - name: Confirm runs as non-root
        # The Dockerfile drops to `sandbox` (uid 1000). Regression here = a
        # tool escape could touch root-owned files. Pin it.
        run: |
          uid=$(docker run --rm ely-sandbox:ci id -u)
          echo "uid=$uid"
          [ "$uid" = "1000" ]

  egress-proxy:
    # Sprint 4b V3 J2.b — boot the egress-proxy + sandbox-net via
    # docker-compose and run the 8-invariant smoke (network isolation,
    # allow-list per domain, fast-deny on cloud metadata, GET-only,
    # HTTPS via CONNECT, backend/qdrant unreachable). Pins the entire
    # security model of J2.b.
    name: Egress proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run egress invariants smoke
        run: bash sandbox/test-egress.sh

  sandbox-run:
    # Sprint 4b V3 J2.c — boot the runner + egress-proxy via docker-compose
    # and run the 10-invariant end-to-end smoke (pure compute, allowed +
    # denied egress, raise capture, wall-clock timeout, read-only rootfs,
    # /tmp tmpfs writable). Pins the runtime contract the backend (J2.d)
    # will rely on.
    name: Sandbox run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run sandbox runner E2E
        run: bash sandbox/test-sandbox-run.sh
