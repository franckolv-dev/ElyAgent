<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00a3bf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Outer cyan ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.35"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.6"/>
  <!-- Letter E -->
  <text x="256" y="326" text-anchor="middle" font-family="Menlo, Monaco, 'SF Mono', monospace"
        font-size="200" font-weight="700" fill="url(#glow)"
        style="filter: drop-shadow(0 0 24px rgba(0,229,255,0.55));">E</text>
  <!-- Accent dot (French é glyph suggestion) -->
  <circle cx="256" cy="120" r="14" fill="#00e5ff" opacity="0.9"/>
</svg>
