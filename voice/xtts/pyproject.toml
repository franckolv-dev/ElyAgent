[project]
name = "ely-voix-xtts"
version = "0.1.0"
description = "Service local de synthèse vocale d'Ely : XTTS-v2, voix clonée, tout reste sur la machine."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Le modèle lui-même. Séparé : les tests du service n'en ont pas besoin, et
# torch pèse plus de deux gigaoctets. Voir README.md pour l'ordre d'installation.
modele = [
    "coqui-tts[codec]>=0.27",
    "torch>=2.9",
    "torchaudio>=2.9",
    "transformers>=4.55,<5",
]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
