# =============================================================================
# ELY — configuration SearXNG
#
# Méta-moteur auto-hébergé, tête de la chaîne de recherche d'Ely.
# Voir docker-compose.yml (service `searxng`) et
# backend/app/agent/tools/search_tool.py (`_search_searxng`).
# =============================================================================

use_default_settings: true

general:
  instance_name: "Ely"
  # Instance privée : ne pas se déclarer aux annuaires publics.
  enable_metrics: false

search:
  # ⚠️ LA LIGNE QUI COMPTE. Sans `json` dans `formats`, l'API rend une erreur
  # et Ely ne reçoit rien d'exploitable — conteneur vert, recherche muette.
  # C'est le mode de panne que la sonde de démarrage guette (`search_mute`).
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "fr"

server:
  # Repris de l'environnement (docker-compose) — jamais en clair ici.
  secret_key: ""
  limiter: false          # instance privée, un seul appelant : le backend
  image_proxy: false

ui:
  static_use_hash: true

# ⚠️ Avec `use_default_settings: true`, cette liste n'est PAS une restriction :
# tous les moteurs par défaut restent actifs. Elle sert seulement à s'assurer
# que ceux-ci sont bien ACTIVÉS (certains sont désactivés d'origine).
#
# Et c'est voulu. Mesuré au premier essai réel (01/08), sur « France » :
#
#     26 résultats remontés
#     moteurs muets : brave « too many requests », qwant CAPTCHA,
#                     startpage CAPTCHA
#
# Trois moteurs bloquaient déjà l'IP de la machine, et la requête a quand même
# abouti — parce que SearXNG les interroge en parallèle et que les autres ont
# répondu. **La largeur est ce qui rend l'ensemble résilient** : restreindre
# la liste rendrait Ely plus fragile, pas plus sobre.
#
# ⚠️ Si les recherches deviennent vides alors que le conteneur est vert,
# regarder `unresponsive_engines` dans la réponse JSON : c'est un blocage
# amont (CAPTCHA), pas un défaut d'Ely. Le repli sur les fournisseurs à
# crédits joue alors son rôle.
# ⚠️ ON NE REDÉCLARE PAS UN MOTEUR. Les réglages livrés dans l'image
# définissent déjà chacun avec ses paramètres propres — `wikicommons` exige un
# `wc_search_type`, `adobe stock` un `adobe_content_types`, `mastodon` un
# `mastodon_type` et un `base_url`, `gitlab` un `base_url`. Les réécrire à la
# main fait échouer leur chargement (« can't register engine ») : c'est ce qui
# est arrivé quatre fois le 01/08.
#
# On se contente donc de BASCULER UN DRAPEAU sur des moteurs déjà définis.
#
# Déjà actifs, rien à faire : wikipedia, duckduckgo, google, google cse, brave,
# github, stackoverflow, docker hub, reuters, unsplash, dailymotion,
# mastodon users/hashtags, wikicommons.images.
engines:
  # ── à activer : désactivés dans les réglages livrés ──
  - name: mojeek           # généraliste, index indépendant
    disabled: false
  - name: gitlab           # catégorie `it`
    disabled: false
  - name: adobe stock      # catégorie `images`
    disabled: false

  # ── généralistes supplémentaires ──
  - name: yahoo            # index distinct de Google et Bing
    disabled: false

  # ── `it` : dépôts et forge ──
  - name: gitea.com
    disabled: false
  - name: sourcehut
    disabled: false

  # ── `images` : création, PAO, illustration ──
  - name: 500px
    disabled: false
  - name: cara            # réseau d'artistes, travaux non génératifs
    disabled: false

  # ── `news` ──
  - name: tagesschau      # actualité allemande de service public
    disabled: false
  - name: bpb             # agence fédérale allemande d'éducation civique
    disabled: false

  # ── matériel et comparaison de prix ──
  - name: geizhals
    disabled: false

  # Déjà actifs, aucune bascule nécessaire : lemmy communities / users /
  # posts, yahoo news, brave, brave.images.
  #
  # ⛔ NON DISPONIBLES dans SearXNG : Discourse et Matrix n'ont pas de moteur
  # intégré. Les forums Discourse sont en général bien indexés par les
  # généralistes — un `site:` dans la requête les atteint sans rien construire.
  #
  # ⛔ ÉCARTÉ : `braveapi` (API officielle de Brave, avec clé) réglerait le
  # « too many requests » du moteur `brave` qui scrape. Décision de Franck du
  # 01/08 : plus cher que les fournisseurs déjà en repli, donc non retenu.

  # ── PAO / prépresse — catégorie `pao` ─────────────────────────────────────
  #
  # ⚠️ `pao` N'EXISTE PAS en amont. SearXNG reconstruit son registre de
  # catégories à chaque chargement, depuis les moteurs déclarés
  # (`engines/__init__.py` : `categories.setdefault(nom, []).append(engine)`) —
  # la nommer ici SUFFIT à la créer. Sur une instance SearXNG standard, une
  # requête `categories=pao` est simplement ignorée et retombe sur `general` :
  # dégradé, pas cassé.
  #
  # Elle n'apparaît pas en onglet dans l'UI (`categories_as_tabs` ne la
  # contient pas, et on ne l'y ajoute pas) : elle sert à Ely, pas à la
  # navigation humaine.
  #
  # ⚠️ Les entrées ci-dessous ne posent QUE `categories:` et `disabled:` sur
  # des moteurs déjà définis — jamais leurs paramètres propres. C'est la
  # nuance qui sépare cette liste de l'échec du 01/08 : `update_settings`
  # fusionne clé par clé sur le nom (`settings_loader.py`, `update_dict`),
  # donc surcharger `categories` préserve `wc_search_type` & consorts, tandis
  # que RÉÉCRIRE un moteur entier les perd et fait « can't register engine ».
  #
  # ⚠️ `categories:` REMPLACE la liste, elle ne s'y ajoute pas. Chaque entrée
  # répète donc la catégorie d'origine du module — relevée dans le code amont,
  # pas devinée : `images` pour les huit premières, `images, icons` pour les
  # deux jeux d'icônes. L'omettre les sortirait de `images`.

  # Le savoir métier. Le module `stackexchange` est générique — `api_site`
  # suffit, et il n'a pas de `categories` au niveau module : la déclarer est
  # donc OBLIGATOIRE ici. graphicdesign couvre la PAO et l'impression, tex la
  # typographie fine, l'imposition et PDF/X.
  - name: graphicdesign
    engine: stackexchange
    api_site: 'graphicdesign'
    shortcut: gd
    categories: [q&a, pao]
  - name: tex
    engine: stackexchange
    api_site: 'tex'
    shortcut: tex
    categories: [q&a, pao]

  # Les sources visuelles à LICENCE EXPLICITE — les seules exploitables en
  # production. Elles restent dans `images` et gagnent `pao`.
  #
  # ⚠️ Ce qui n'est PAS ici est un choix : pinterest, deviantart, artstation,
  # pixiv, wallhaven sont des portfolios, pas des banques libres de droits.
  # Les faire remonter sur `pao` reviendrait à proposer à l'impression des
  # images qu'on n'a pas le droit d'imprimer. Même raison pour `500px` et
  # `cara`, activés plus haut sur `images` : on les laisse en illustration et
  # en veille, on ne les qualifie pas pour la production.
  - name: openverse                  # agrégateur CC, filtre de licence intégré
    categories: [images, pao]
  - name: wikicommons.images
    categories: [images, pao]
  - name: artic                      # domaine public, qualité musée
    categories: [images, pao]
  - name: unsplash
    categories: [images, pao]
  - name: pexels
    categories: [images, pao]
  - name: pixabay images
    disabled: false
    categories: [images, pao]
  - name: public domain image archive
    disabled: false
    categories: [images, pao]
  - name: library of congress
    disabled: false
    categories: [images, pao]

  # Icônes VECTORIELLES — du SVG, donc imprimable sans perte d'échelle.
  - name: flaticon
    disabled: false
    categories: [images, icons, pao]
  - name: material icons
    disabled: false
    categories: [images, icons, pao]

  # ── Recherche inversée d'image ────────────────────────────────────────────
  #
  # ⚠️ TinEye prend une URL D'IMAGE comme requête, pas des mots. Sa catégorie
  # amont est `general` (relevé dans `engines/tineye.py`) : l'activer tel quel
  # enverrait CHAQUE recherche ordinaire d'Ely dans un moteur qui ne peut pas y
  # répondre, avec ~9 s d'attente à la clé. Il est donc sorti dans une
  # catégorie à lui — atteignable par le bang `!tin <url>`, jamais par accident.
  #
  # Il sert à vérifier provenance et antériorité d'un visuel AVANT de partir en
  # production : un geste délibéré, pas un moteur de fond.
  - name: tineye
    disabled: false
    categories: [reverse_image]

  # ── à écarter ──
  # Qwant tape une API non documentée (api.qwant.com/v3, rétro-conçue) et se
  # heurte à DataDome : CAPTCHA systématique sur les essais du 01/08. Aucune
  # clé n'y changerait rien — le moteur est fragile par construction.
  - name: qwant
    disabled: true

  # ⚠️ `disabled: false` NE SUFFIT PAS sur ces trois-là : ils portent
  # `inactive: true` en amont, et `load_engines` fait `continue` AVANT même de
  # charger le moteur (`engines/__init__.py`). Il faudrait aussi `inactive:
  # false` — et un moteur que ses mainteneurs marquent inactif est réputé
  # cassé. L'activer produirait exactement le mode de panne que ce fichier
  # combat : un moteur vert qui ne rend rien.
  #
  # À rouvrir seulement après vérification manuelle sur l'UI SearXNG :
  #
  #   - name: openclipart     # SVG domaine public — la meilleure source PAO
  #     disabled: false       # ⚠️ timeout amont à 30 s : le baisser d'abord,
  #     inactive: false       #    sinon une recherche `pao` attend 30 s quand
  #     timeout: 6.0          #    Ely coupe à 15 s (search_tool.py)
  #     categories: [images, pao]
  #
  #   - name: marginalia      # index indépendant, bon en texte long
  #     disabled: false       # ⚠️ exige une clé : about.marginalia-search.com
  #     inactive: false
  #
  #   - name: repology        # versions de paquets, toutes distributions
  #     disabled: false
  #     inactive: false
