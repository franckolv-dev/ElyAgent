# =============================================================================
# ELY — configuration SearXNG
#
# Méta-moteur auto-hébergé, tête de la chaîne de recherche d'Ely.
# Voir docker-compose.yml (service `searxng`) et
# backend/app/agent/tools/search_tool.py (`_search_searxng`).
# =============================================================================

use_default_settings: true

general:
  instance_name: "Ely"
  # Instance privée : ne pas se déclarer aux annuaires publics.
  enable_metrics: false

search:
  # ⚠️ LA LIGNE QUI COMPTE. Sans `json` dans `formats`, l'API rend une erreur
  # et Ely ne reçoit rien d'exploitable — conteneur vert, recherche muette.
  # C'est le mode de panne que la sonde de démarrage guette (`search_mute`).
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "fr"

server:
  # Repris de l'environnement (docker-compose) — jamais en clair ici.
  secret_key: ""
  limiter: false          # instance privée, un seul appelant : le backend
  image_proxy: false

ui:
  static_use_hash: true

# ⚠️ Avec `use_default_settings: true`, cette liste n'est PAS une restriction :
# tous les moteurs par défaut restent actifs. Elle sert seulement à s'assurer
# que ceux-ci sont bien ACTIVÉS (certains sont désactivés d'origine).
#
# Et c'est voulu. Mesuré au premier essai réel (01/08), sur « France » :
#
#     26 résultats remontés
#     moteurs muets : brave « too many requests », qwant CAPTCHA,
#                     startpage CAPTCHA
#
# Trois moteurs bloquaient déjà l'IP de la machine, et la requête a quand même
# abouti — parce que SearXNG les interroge en parallèle et que les autres ont
# répondu. **La largeur est ce qui rend l'ensemble résilient** : restreindre
# la liste rendrait Ely plus fragile, pas plus sobre.
#
# ⚠️ Si les recherches deviennent vides alors que le conteneur est vert,
# regarder `unresponsive_engines` dans la réponse JSON : c'est un blocage
# amont (CAPTCHA), pas un défaut d'Ely. Le repli sur les fournisseurs à
# crédits joue alors son rôle.
# ⚠️ ON NE REDÉCLARE PAS UN MOTEUR. Les réglages livrés dans l'image
# définissent déjà chacun avec ses paramètres propres — `wikicommons` exige un
# `wc_search_type`, `adobe stock` un `adobe_content_types`, `mastodon` un
# `mastodon_type` et un `base_url`, `gitlab` un `base_url`. Les réécrire à la
# main fait échouer leur chargement (« can't register engine ») : c'est ce qui
# est arrivé quatre fois le 01/08.
#
# On se contente donc de BASCULER UN DRAPEAU sur des moteurs déjà définis.
#
# Déjà actifs, rien à faire : wikipedia, duckduckgo, google, google cse, brave,
# github, stackoverflow, docker hub, reuters, unsplash, dailymotion,
# mastodon users/hashtags, wikicommons.images.
engines:
  # ── à activer : désactivés dans les réglages livrés ──
  - name: mojeek           # généraliste, index indépendant
    disabled: false
  - name: gitlab           # catégorie `it`
    disabled: false
  - name: adobe stock      # catégorie `images`
    disabled: false

  # ── généralistes supplémentaires ──
  - name: yahoo            # index distinct de Google et Bing
    disabled: false

  # ── `it` : dépôts et forge ──
  - name: gitea.com
    disabled: false
  - name: sourcehut
    disabled: false

  # ── `images` : création, PAO, illustration ──
  - name: 500px
    disabled: false
  - name: cara            # réseau d'artistes, travaux non génératifs
    disabled: false

  # ── `news` ──
  - name: tagesschau      # actualité allemande de service public
    disabled: false
  - name: bpb             # agence fédérale allemande d'éducation civique
    disabled: false

  # ── matériel et comparaison de prix ──
  - name: geizhals
    disabled: false

  # Déjà actifs, aucune bascule nécessaire : lemmy communities / users /
  # posts, yahoo news, brave, brave.images.
  #
  # ⛔ NON DISPONIBLES dans SearXNG : Discourse et Matrix n'ont pas de moteur
  # intégré. Les forums Discourse sont en général bien indexés par les
  # généralistes — un `site:` dans la requête les atteint sans rien construire.
  #
  # ⛔ ÉCARTÉ : `braveapi` (API officielle de Brave, avec clé) réglerait le
  # « too many requests » du moteur `brave` qui scrape. Décision de Franck du
  # 01/08 : plus cher que les fournisseurs déjà en repli, donc non retenu.

  # ── à écarter ──
  # Qwant tape une API non documentée (api.qwant.com/v3, rétro-conçue) et se
  # heurte à DataDome : CAPTCHA systématique sur les essais du 01/08. Aucune
  # clé n'y changerait rien — le moteur est fragile par construction.
  - name: qwant
    disabled: true
