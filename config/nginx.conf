server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver — re-resolves backend/frontend hostnames
    # every 5s so nginx picks up the new IP when a container is recreated.
    # Without this, nginx caches the IP at startup and returns 502 until
    # it's manually restarted.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── Compression (gzip) — saves 60-80% on JSON payloads ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/xml+rss
        text/plain
        text/css
        text/xml
        text/javascript;
    gzip_proxied any;

    # ── Proxy buffering tuned for API responses ──
    proxy_buffer_size 8k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # WebSocket connections — forward to FastAPI backend with upgrade headers
    location /ws/ {
        set $backend_host backend; proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend API routes — proxy to FastAPI.
    # `webhook` ajouté pour les callbacks externes (Telegram, plus tard
    # WhatsApp Cloud, etc.) — sans ça les POST de Telegram tombent sur
    # Next.js qui renvoie 404 et l'on est forcé en mode polling.
    # `static` ajouté (mai 2026) pour servir les binaires ELY Desktop
    # (montés depuis ./desktop/dist sur /app/static/desktop côté backend).
    # Sans ce route, le download du daemon récupérait la 404 HTML de Next.js.
    location ~ ^/(api|auth|admin|skills|scheduler|hosts|tts|health|analytics|webhook|static)/ {
        set $backend_host backend; proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeout (was 60s — too short for capture+mail and other multi-step
        # workflows where the backend chains 3-5 tool calls on a local LLM,
        # easily exceeding 60s of prompt processing on Qwen 2.5 14B local).
        # 600s = 10 min, safe for any realistic agent turn while still bounding
        # zombie connections.
        proxy_read_timeout 600s;
        # Important pour les binaires (~5 MB) : pas de buffering nginx,
        # streaming direct au navigateur.
        proxy_buffering off;
    }

    # Everything else — Next.js frontend
    location / {
        set $frontend_host frontend; proxy_pass http://$frontend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeout — Next.js SSR may fetch a full conversation history
        # (with attachments) which can be slow on first hit. 60s was the cause
        # of 504 errors when reloading a chat page with a heavy conversation.
        proxy_read_timeout 600s;
    }
}
