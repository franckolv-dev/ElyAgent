server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver — re-resolves backend/frontend hostnames
    # every 5s so nginx picks up the new IP when a container is recreated.
    # Without this, nginx caches the IP at startup and returns 502 until
    # it's manually restarted.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── Compression (gzip) — saves 60-80% on JSON payloads ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/xml+rss
        text/plain
        text/css
        text/xml
        text/javascript;
    gzip_proxied any;

    # ── Proxy buffering tuned for API responses ──
    proxy_buffer_size 8k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # WebSocket connections — forward to FastAPI backend with upgrade headers
    location /ws/ {
        set $backend_host backend; proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend API routes — proxy to FastAPI
    location ~ ^/(api|auth|admin|skills|scheduler|hosts|tts|health|analytics)/ {
        set $backend_host backend; proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else — Next.js frontend
    location / {
        set $frontend_host frontend; proxy_pass http://$frontend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
