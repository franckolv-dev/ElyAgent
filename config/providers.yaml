# LLM Provider Configuration
# Switch active_provider to change the AI backend

active_provider: anthropic

providers:
  anthropic:
    model: claude-haiku-4-5-20251001
    max_tokens: 4096
    temperature: 0.7

  ollama:
    model: qwen2.5:7b
    base_url: http://localhost:11434
    max_tokens: 4096
    temperature: 0.7

  deepseek:
    model: deepseek-chat
    max_tokens: 4096
    temperature: 0.7
