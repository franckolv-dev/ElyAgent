[project]
name = "cyber-entity-backend"
version = "0.1.0"
description = "Cyber-Entity AI Agent Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "paramiko>=3.5.0",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "edge-tts>=7.0.0",
    "langchain-mistralai>=1.1.1",
    "langchain-openai>=0.3.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10",
    "playwright>=1.40.0",
    "faster-whisper>=1.0.0",
    "firebase-admin>=6.5.0",
    "google-generativeai>=0.8.0",
    "langchain-google-genai>=2.0.0",
    "pypdf>=4.0.0",
    "youtube-transcript-api>=0.6.0",
    "yt-dlp>=2024.0.0",
    "qrcode[pil]>=7.4.0",
    "duckduckgo-search>=6.0.0",
    "tavily-python>=0.3.0",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "pyautogui>=0.9.54",
    "slack-bolt[async]>=1.20.0",
    "discord.py>=2.4.0",
    "croniter>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests", ".venv", "alembic"]

[tool.ruff.lint]
# Pragmatic config — mostly-cosmetic warnings silenced to match this codebase
# long-standing style. CI enforces only the critical correctness checks.
ignore = [
    "E402",  # imports not at top (lazy imports in agent node closures)
    "E701",  # multiple statements on one line (one-liner factories)
    "E712",  # true/false-comparison (SQLAlchemy idiom)
    "E741",  # ambiguous variable name (l, I, O)
    "F401",  # unused imports (legit re-exports)
    "F541",  # f-string without placeholder (explicit formatting choice)
    "F811",  # redefined unused (decorator stacking)
    "F821",  # undefined name (forward references in type hints are fine)
    "F841",  # unused local variable (caught variables in try/except)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
