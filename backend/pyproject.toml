[project]
name = "cyber-entity-backend"
version = "2.3.0"
description = "ELY — self-hosted AI agent backend (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "paramiko>=3.5.0",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.27",  # audit 13/06 (H3) : 2 DoS upload < 0.0.27
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "edge-tts>=7.0.0",
    "langchain-mistralai>=1.1.1",
    "langchain-openai>=0.3.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10",
    "playwright>=1.40.0",
    "faster-whisper>=1.0.0",
    "firebase-admin>=6.5.0",
    "google-generativeai>=0.8.0",
    "langchain-google-genai>=2.0.0",
    "pypdf>=6.12.0",  # audit 13/06 (H3) : DoS PDF (CPU/mémoire) < 6.12.0
    "python-docx>=1.1.0",    # .docx extraction
    "pymupdf>=1.24.0",       # géométrie PDF — reconstruction structurelle PDF→DOCX
    "openpyxl>=3.1.0",       # .xlsx extraction
    "xlrd>=2.0.1",           # .xls extraction (legacy Excel 97-2003)
    "youtube-transcript-api>=0.6.0",
    "yt-dlp>=2024.0.0",
    "qrcode[pil]>=7.4.0",
    "duckduckgo-search>=6.0.0",
    "tavily-python>=0.3.0",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "pyautogui>=0.9.54",
    "slack-bolt[async]>=1.20.0",
    "discord.py>=2.4.0",
    "croniter>=2.0.0",
    # WhatsApp Web bridge (unofficial multi-device, QR-code pairing).
    # neonize is a Python wrapper around whatsmeow (Go). It uses the real
    # WhatsApp mobile protocol via WebSocket, no Chromium required.
    # ⚠ Alternative to Meta Cloud API (which we keep too in whatsapp.py).
    # Licence: AGPL v3 for neonize itself — fine for self-hosted personal use.
    #
    # IMPORTANT: WhatsApp rejects older protocol versions with
    # `err-client-outdated` (405). You need neonize >= 0.3.17.post0 as of
    # 2026-04-24. BUT that version requires protobuf>=6.x which conflicts
    # with the deprecated `google-generativeai` package (still pinned to
    # protobuf<5). Workaround : we install neonize post-sync via
    # `POST_SYNC_INSTALL` in the Dockerfile, bypassing the lockfile.
    # Proper fix (TODO): migrate 3 files from google-generativeai to
    # the new google-genai SDK which supports protobuf 6.
    "neonize>=0.3.0",
    "pillow>=11.3.0",
    # Sprint 4b V2 — static checks (ruff + mypy) for the generated-@tool
    # validation pipeline. These run IN-PROCESS at skill-generation time
    # (code_guard → ruff → mypy → smoke → bench), not just in CI, so they
    # must be real runtime deps — prod installs with `uv sync --no-dev`.
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests", ".venv", "alembic"]

[tool.ruff.lint]
# Pragmatic config — mostly-cosmetic warnings silenced to match this codebase
# long-standing style. CI enforces only the critical correctness checks.
#
# `select` is EXPLICIT on purpose. It writes down what used to be ruff's
# *default* rule set (E4/E7/E9 + F), which this project relied on without
# ever saying so. Ruff 0.16.0 widened that default (YTT, ASYNC, BLE, B, UP,
# I…) and the same command went from green to 2027 findings on unchanged
# code (23/07/2026, cf. #234). The pin in ci.yml stopped the bleeding; this
# line removes the cause — a linter's defaults are someone else's decision,
# and they change without notice.
#
# Verified faithful: on ruff 0.15.15, with `ignore` neutralised on both
# sides, the old default and this `select` report the exact same codes
# (E402 E701 E712 E741 F401 F541 F811 F821 F841 — i.e. precisely the
# `ignore` list below, which is why CI was green). No coverage lost.
#
# Same reasoning as the in-process validation pipeline, which already runs
# `ruff --isolated --select E,F` (app/services/learning/static_checks.py).
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # imports not at top (lazy imports in agent node closures)
    "E701",  # multiple statements on one line (one-liner factories)
    "E712",  # true/false-comparison (SQLAlchemy idiom)
    "E741",  # ambiguous variable name (l, I, O)
    "F401",  # unused imports (legit re-exports)
    "F541",  # f-string without placeholder (explicit formatting choice)
    "F811",  # redefined unused (decorator stacking)
    "F821",  # undefined name (forward references in type hints are fine)
    "F841",  # unused local variable (caught variables in try/except)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
