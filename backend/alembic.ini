# =============================================================================
# ELY — configuration Alembic (B-4, revue multi-utilisateurs 2026-06-10)
#
# L'URL de base n'est PAS définie ici : migrations/env.py la lit depuis
# app.config.get_settings().database_url (donc .env / DATABASE_URL), pour
# qu'il n'y ait qu'UNE source de vérité — SQLite par défaut, Postgres en
# opt-in (docs/DEPLOYMENT.md).
#
# Usage :
#   uv run alembic revision --autogenerate -m "ma migration"
#   uv run alembic upgrade head
# Au boot, app/services/alembic_runner.py stampe/upgrade automatiquement.
# =============================================================================
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
